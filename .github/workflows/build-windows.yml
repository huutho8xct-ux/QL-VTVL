name: Đóng gói bộ cài Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cài thư viện
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Kiểm thử
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests

      - name: Đóng gói PyInstaller
        run: pyinstaller qlvtvl.spec --noconfirm --clean

      - name: Kiểm tra tệp chạy khởi động được
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath "dist\QL-VTVL\QL-VTVL.exe" -ArgumentList "--selftest" -PassThru -Wait -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "Self-test failed: $($p.ExitCode)" }

      - name: Tải gói ngôn ngữ tiếng Việt cho bộ cài
        shell: pwsh
        continue-on-error: true
        run: Invoke-WebRequest -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/Vietnamese.isl" -OutFile "installer\Vietnamese.isl"

      - name: Tạo bộ cài Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc installer\qlvtvl.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Tạo bản chạy trực tiếp (portable)
        shell: pwsh
        run: Compress-Archive -Path dist\QL-VTVL\* -DestinationPath dist\installer\QL-VTVL_portable.zip

      - name: Tạo mã kiểm tra SHA-256
        shell: pwsh
        run: |
          Get-ChildItem dist\installer -File | Where-Object Name -ne 'SHA256SUMS.txt' | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding utf8 dist\installer\SHA256SUMS.txt
          Get-Content dist\installer\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: QL-VTVL-Windows
          path: dist/installer/*

      - name: Phát hành (khi gắn tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: QL-VTVL ${{ github.ref_name }} – Bộ cài Windows
          body_path: docs/RELEASE_NOTES.md
          files: dist/installer/*
